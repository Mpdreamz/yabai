name: release

# The release step, run by hand (Actions > release > Run workflow, or `gh workflow run release -f version=…`): builds
# macos-27, signs it with the Developer ID, notarizes it, publishes the release with the zip and its checksum (which
# creates the tag on the commit that was built), then writes the cask to mpdreamz/homebrew-tap.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release: upstream's version, then this fork's count, e.g. 7.1.25-mpd.1"
        required: true
      dry_run:
        description: "Dry run: build, sign and notarize, keep the zip on the run, release nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Releases come from macos-27; a dry run may try a branch.
    if: github.ref == 'refs/heads/macos-27' || inputs.dry_run
    runs-on: macos-26
    # Room for an hour of notarization on top of the build.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      # All of the history, to list what this fork adds to upstream in the release notes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-mpd\.[0-9]+$ ]] \
            || { echo "version $VERSION is not <upstream version>-mpd.<n>, e.g. 7.1.25-mpd.1" >&2; exit 1; }
          upstream="$(sed -nE 's/^#define (MAJOR|MINOR|PATCH) +([0-9]+)$/\2/p' src/yabai.c | paste -sd. -)"
          [ "${VERSION%-mpd.*}" = "$upstream" ] \
            || { echo "version $VERSION does not start with the upstream version in src/yabai.c ($upstream)" >&2; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released." >&2
            exit 1
          fi

      - name: Build
        run: |
          make install
          bin/yabai --version
          lipo -archs bin/yabai

      - name: Sign with the Developer ID
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "No DEVELOPER_ID_P12: store the secrets with scripts/release-secrets.sh" >&2; exit 1; }
          # A keychain of its own, deleted when the job ends (see the last step).
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$P12" >"$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          # The intermediate certificate, so codesign can build the chain to Apple.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | tr -d '"' | head -1)"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in DEVELOPER_ID_P12" >&2; exit 1; }
          # The hardened runtime and a secure timestamp, which notarization requires. The identifier is the one in
          # assets/Info.plist; with the team it is what macOS ties the Accessibility permission to, so the permission
          # carries over from one release to the next.
          codesign --force --options runtime --timestamp --sign "$identity" --keychain "$keychain" bin/yabai
          codesign --verify --strict --verbose=2 bin/yabai
          codesign -dv bin/yabai 2>&1 | grep -E '^(Identifier|TeamIdentifier|Runtime Version)='

      - name: Package the zip
        run: |
          dir="dist/yabai-$VERSION"
          mkdir -p "$dir/bin" "$dir/doc"
          cp bin/yabai "$dir/bin/"
          cp doc/yabai.1 "$dir/doc/"
          cp LICENSE.txt "$dir/"
          ditto -c -k --keepParent "$dir" "dist/yabai-$VERSION.zip"
          rm -rf "$dir"

      # A bare binary cannot be stapled: Gatekeeper looks the ticket up online the first time it runs.
      - name: Notarize the zip
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "${KEY_P8:?no NOTARY_KEY_P8: store it with scripts/release-secrets.sh --p8 …}" >"$key"
          auth=(--key "$key" --key-id "$KEY_ID" --issuer "$ISSUER")
          xcrun notarytool submit "dist/yabai-$VERSION.zip" "${auth[@]}" --output-format json >"$RUNNER_TEMP/submit.json"
          id="$(jq -r '.id // empty' "$RUNNER_TEMP/submit.json")"
          [ -n "$id" ] || { cat "$RUNNER_TEMP/submit.json"; exit 1; }
          echo "notarization: submitted as $id"
          xcrun notarytool wait "$id" "${auth[@]}" --timeout 60m || true
          status="$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | jq -r '.status // empty')"
          echo "notarization: $status ($id)"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
            rm -f "$key"
            exit 1
          fi
          rm -f "$key"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 "yabai-$VERSION.zip" >"yabai-$VERSION.zip.sha256"
          cat ./*.sha256

      - name: Release notes
        run: |
          git fetch --quiet https://github.com/asmvik/yabai.git master
          base="$(git merge-base HEAD FETCH_HEAD)"
          {
            echo "asmvik/yabai \`$(git rev-parse --short "$base")\` with the macOS 27 fixes reported in the upstream issues:"
            echo
            git log --reverse --format='- %s (%an, `%h`)' "$base..HEAD" -- src makefile
            echo
            echo "**Install:** \`brew uninstall asmvik/formulae/yabai\` (if you have it), then"
            echo "\`brew install --cask mpdreamz/tap/yabai\`, and write the sudoers rule for \`--load-sa\` again: the binary changed."
          } >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Keep the files on the run
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: yabai-${{ inputs.version }}-dry-run
          path: dist/*

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
          names="$(gh release view "v$VERSION" --json assets --jq '[.assets[].name] | sort | join(" ")')"
          [ "$names" = "yabai-$VERSION.zip yabai-$VERSION.zip.sha256" ] || { echo "release has: $names" >&2; exit 1; }

      - name: Update the Homebrew tap
        if: ${{ !inputs.dry_run }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN: the tap was not updated. Store it (scripts/release-secrets.sh --tap), then run the tap workflow."
            exit 0
          fi
          scripts/bump-tap.sh "$VERSION"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
